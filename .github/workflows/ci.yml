name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core logic tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v5
      - name: Run unit tests
        run: swift test

  ios-build:
    name: Build iPhone app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Check project file
        run: python3 scripts/check_pbxproj.py SegmentationValidator.xcodeproj/project.pbxproj

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -quiet \
            -project SegmentationValidator.xcodeproj \
            -scheme SegmentationValidator \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Inspect app bundle
        run: |
          APP=build/Build/Products/Release-iphoneos/SegmentationValidator.app
          plutil -p "$APP/Info.plist"
          ls -d "$APP"/*.lproj
          plutil -p "$APP/de.lproj/Localizable.strings" | head -n 5
          plutil -p "$APP/de.lproj/InfoPlist.strings"
          xcrun --sdk iphoneos assetutil --info "$APP/Assets.car" | python3 -c 'import json, sys; [print(a.get("AssetType"), a.get("Name"), a.get("Appearance", "")) for a in json.load(sys.stdin)[1:]]'

      - name: Check strings are translated
        run: python3 scripts/check_strings.py

      - name: Build with the newest installed Xcode
        run: |
          NEWEST=$(python3 -c '
          import glob, re
          apps = [a for a in glob.glob("/Applications/Xcode_*.app") if re.fullmatch(r".*/Xcode_[0-9.]+\.app", a)]
          print(max(apps, key=lambda a: [int(x) for x in re.findall(r"[0-9]+", a.rsplit("/", 1)[1])]))
          ')
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version
          xcodebuild build \
            -quiet \
            -project SegmentationValidator.xcodeproj \
            -scheme SegmentationValidator \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-newest \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SegmentationValidator.app Payload/
          zip -qry SegmentationValidator-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SegmentationValidator-unsigned-ipa
          path: SegmentationValidator-unsigned.ipa
          retention-days: 30
