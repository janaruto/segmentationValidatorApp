name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core logic tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v5
      - name: Run unit tests
        run: swift test

  ios-build:
    name: Build iPhone app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Check project file
        run: python3 scripts/check_pbxproj.py SegmentationValidator.xcodeproj/project.pbxproj

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -quiet \
            -project SegmentationValidator.xcodeproj \
            -scheme SegmentationValidator \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SegmentationValidator.app Payload/
          zip -qry SegmentationValidator-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SegmentationValidator-unsigned-ipa
          path: SegmentationValidator-unsigned.ipa
          retention-days: 30
